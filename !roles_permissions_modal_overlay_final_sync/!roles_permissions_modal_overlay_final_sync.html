<!DOCTYPE html>
<html lang="en" data-cnds-theme="light">
<head>
  <script>
    window.addEventListener('error', e => {
      if (e.message && e.message.includes('ResizeObserver')) { e.stopImmediatePropagation(); e.preventDefault(); return true; }
    }, true);
    const _origError = console.error;
    console.error = function(...args) {
      if (args[0] && String(args[0]).includes('ResizeObserver')) return;
      _origError.apply(console, args);
    };
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roles — Expireon</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>

  <link rel="stylesheet" href="https://wswilliams67.github.io/nimbus/css/themes/primitives.css">
  <link rel="stylesheet" href="https://wswilliams67.github.io/nimbus/css/themes/light.css">
  <link rel="stylesheet" href="https://wswilliams67.github.io/nimbus/css/nimbus.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..24,400..600,0..1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../_shared/expireon-app.css?v=6">

  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #c3c6d7; border-radius: 10px; }
  </style>
</head>

<body class="cnds-product-expireon h-full overflow-hidden flex" data-screen-label="P2 · Roles">

  <script>const ACTIVE_NAV = 'admin_roles';</script>
  <script src="../_shared/sidenav.js"></script>

  <div class="app-main">

    <script>const TOPNAV_SEARCH = 'Search roles…';</script>
    <script src="../_shared/topnav.js"></script>

    <main class="app-scroll" id="main-content">
      <div class="app-canvas">

        <div class="section-strip">
          <span><a href="#">Admin</a></span>
          <span class="sep" aria-hidden="true"></span>
          <span class="current">Roles</span>
        </div>

        <header class="page-eyebrow">
          <h1>Manage role definitions, permissions, and access control for the system</h1>
        </header>

        <section class="card">

          <div class="toolbar-v2">
            <div class="toolbar-search">
              <input type="text" class="cf-input-control" placeholder="Search roles…">
              <button class="btn btn-secondary btn-search">Search</button>
            </div>
            <div class="toolbar-spacer"></div>
            <button class="btn btn-primary btn-primary-cta" onclick="openModal('New Role', true)">
              <span class="material-symbols-outlined" style="font-size:18px">add</span>
              New Role
            </button>
          </div>

          <div class="table-wrap">
            <table class="table table-hover">
              <thead>
                <tr>
                  <th>Role Name</th>
                  <th>User Count</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td class="fw-semibold">Test</td>
                  <td class="small text-muted">0</td>
                  <td class="text-end">
                    <button class="btn btn-secondary btn-sm flex items-center gap-1" style="margin-left:auto" onclick="openModal('Test')">
                      <span class="material-symbols-outlined" style="font-size:16px">lock_open</span>
                      Permissions
                    </button>
                  </td>
                </tr>
                <tr>
                  <td class="fw-semibold">admin</td>
                  <td class="small text-muted">11</td>
                  <td class="text-end">
                    <button class="btn btn-secondary btn-sm flex items-center gap-1" style="margin-left:auto" onclick="openModal('admin')">
                      <span class="material-symbols-outlined" style="font-size:16px">lock_open</span>
                      Permissions
                    </button>
                  </td>
                </tr>
                <tr>
                  <td class="fw-semibold">Legal Reviewer</td>
                  <td class="small text-muted">4</td>
                  <td class="text-end">
                    <button class="btn btn-secondary btn-sm flex items-center gap-1" style="margin-left:auto" onclick="openModal('Legal Reviewer')">
                      <span class="material-symbols-outlined" style="font-size:16px">lock_open</span>
                      Permissions
                    </button>
                  </td>
                </tr>
                <tr>
                  <td class="fw-semibold">Read Only</td>
                  <td class="small text-muted">23</td>
                  <td class="text-end">
                    <button class="btn btn-secondary btn-sm flex items-center gap-1" style="margin-left:auto" onclick="openModal('Read Only')">
                      <span class="material-symbols-outlined" style="font-size:16px">lock_open</span>
                      Permissions
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="card-footer">
            <div class="pager" style="justify-content:flex-end;width:100%">
              <span class="pager-range">1–4 of 7</span>
              <div class="pager-arrows">
                <button disabled aria-label="First"><span class="material-symbols-outlined">first_page</span></button>
                <button disabled aria-label="Previous"><span class="material-symbols-outlined">chevron_left</span></button>
                <button aria-label="Next"><span class="material-symbols-outlined">chevron_right</span></button>
                <button aria-label="Last"><span class="material-symbols-outlined">last_page</span></button>
              </div>
            </div>
          </div>

        </section>

      </div>
    </main>

  </div>

  <!-- Permissions Modal -->
  <div id="permissions-modal" style="display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,0.4);backdrop-filter:blur(2px)" onclick="handleBackdropClick(event)">
    <div class="flex flex-col overflow-hidden" style="background:#fff;width:100%;max-width:64rem;height:800px;max-height:90vh;border-radius:12px;border:1px solid var(--cnds-border-color,#e0e0e0);box-shadow:0 20px 60px rgba(0,0,0,0.2)">

      <!-- Modal Header -->
      <div style="padding:20px 24px 16px;border-bottom:1px solid var(--cnds-border-color,#e0e0e0)">
        <div class="flex items-center justify-between mb-3">
          <h4 class="fw-bold mb-0">Permissions — <span class="text-primary" id="modal-role-name">Role</span></h4>
          <button class="btn btn-link p-1" onclick="closeModal()">
            <span class="material-symbols-outlined text-muted">close</span>
          </button>
        </div>
        <div class="flex items-center gap-4">
          <div class="toolbar-search" style="flex:1">
            <input class="cf-input-control" type="text" placeholder="Filter permissions…">
          </div>
          <div class="flex items-center gap-3 px-4 py-2 rounded-lg" style="background:var(--cnds-surface-container,#ededf9)">
            <span class="fw-semibold small">Grant all permissions</span>
            <div class="form-check form-switch mb-0">
              <input class="form-check-input" type="checkbox">
            </div>
          </div>
        </div>
      </div>

      <!-- Modal Body: Two-Column -->
      <div class="flex-1 flex overflow-hidden">

        <!-- Left: Category List -->
        <div class="flex-shrink-0 overflow-y-auto custom-scrollbar" style="width:20rem;border-right:1px solid var(--cnds-border-color,#e0e0e0);background:var(--cnds-surface-container-low,#f3f3fe)">
          <div style="padding:12px;display:flex;flex-direction:column;gap:4px">
            <button class="w-full flex items-center justify-between p-3 rounded-lg text-start fw-semibold" style="background:var(--cnds-product-expireon-blue-50,#f0f0fa);color:var(--cnds-product-accent,#4e45d6)" onclick="selectCategory(this, 'Identity Management Permissions')">
              <span class="flex items-center gap-2">
                <span class="material-symbols-outlined" style="font-size:20px;font-variation-settings:'FILL' 1">account_circle</span>
                Identity Management
              </span>
              <span class="badge badge-primary">12</span>
            </button>
            <button class="w-full flex items-center justify-between p-3 rounded-lg text-start text-muted" onclick="selectCategory(this, 'Audit Logging Permissions')">
              <span class="flex items-center gap-2">
                <span class="material-symbols-outlined" style="font-size:20px">receipt_long</span>
                Audit Logging
              </span>
              <span class="badge badge-secondary">8</span>
            </button>
            <button class="w-full flex items-center justify-between p-3 rounded-lg text-start text-muted" onclick="selectCategory(this, 'Account Permissions')">
              <span class="flex items-center gap-2">
                <span class="material-symbols-outlined" style="font-size:20px">manage_accounts</span>
                Account
              </span>
              <span class="badge badge-secondary">4</span>
            </button>
            <button class="w-full flex items-center justify-between p-3 rounded-lg text-start text-muted" onclick="selectCategory(this, 'Language Management Permissions')">
              <span class="flex items-center gap-2">
                <span class="material-symbols-outlined" style="font-size:20px">language</span>
                Language Management
              </span>
              <span class="badge badge-secondary">6</span>
            </button>
            <button class="w-full flex items-center justify-between p-3 rounded-lg text-start text-muted" onclick="selectCategory(this, 'Template Management Permissions')">
              <span class="flex items-center gap-2">
                <span class="material-symbols-outlined" style="font-size:20px">description</span>
                Template Management
              </span>
              <span class="badge badge-secondary">15</span>
            </button>
            <button class="w-full flex items-center justify-between p-3 rounded-lg text-start text-muted" onclick="selectCategory(this, 'Advanced Config Permissions')">
              <span class="flex items-center gap-2">
                <span class="material-symbols-outlined" style="font-size:20px">settings_suggest</span>
                Advanced Config
              </span>
              <span class="badge badge-secondary">5</span>
            </button>
          </div>
        </div>

        <!-- Right: Permissions List -->
        <div class="flex-1 overflow-y-auto custom-scrollbar" style="padding:24px;display:flex;flex-direction:column;gap:16px">
          <div class="flex items-center gap-2 pb-3" style="border-bottom:1px solid var(--cnds-border-color,#e0e0e0)">
            <span class="material-symbols-outlined text-primary" style="font-variation-settings:'FILL' 1">badge</span>
            <h5 class="fw-semibold mb-0" id="perm-category-title">Identity Management Permissions</h5>
          </div>

          <!-- User Management -->
          <div class="card" style="margin:0">
            <div class="card-header flex items-center gap-2">
              <input class="form-check-input" type="checkbox" checked>
              <span class="fw-semibold small">User Management</span>
            </div>
            <div class="card-body" style="display:flex;flex-direction:column;gap:10px">
              <label class="flex items-center gap-2 cursor-pointer">
                <input class="form-check-input" type="checkbox" checked>
                <span class="small">Create Users</span>
              </label>
              <div style="display:flex;flex-direction:column;gap:6px">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input class="form-check-input" type="checkbox" checked>
                  <span class="small fw-semibold">Edit Users</span>
                </label>
                <div style="margin-left:16px;padding-left:12px;border-left:2px solid var(--cnds-border-color,#e0e0e0);display:flex;flex-direction:column;gap:6px">
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input class="form-check-input" type="checkbox" checked>
                    <span class="small text-muted">Manage Roles</span>
                  </label>
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input class="form-check-input" type="checkbox">
                    <span class="small text-muted">Manage Organization Tree</span>
                  </label>
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input class="form-check-input" type="checkbox" checked>
                    <span class="small text-muted">Reset Passwords</span>
                  </label>
                </div>
              </div>
              <label class="flex items-center gap-2 cursor-pointer">
                <input class="form-check-input" type="checkbox">
                <span class="small">Delete Users</span>
              </label>
            </div>
          </div>

          <!-- Group Management -->
          <div class="card" style="margin:0">
            <div class="card-header flex items-center gap-2">
              <input class="form-check-input" type="checkbox">
              <span class="fw-semibold small">Group Management</span>
            </div>
            <div class="card-body" style="display:flex;flex-direction:column;gap:10px">
              <label class="flex items-center gap-2 cursor-pointer">
                <input class="form-check-input" type="checkbox">
                <span class="small">Create Groups</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input class="form-check-input" type="checkbox">
                <span class="small">Modify Group Membership</span>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="card-footer flex justify-end gap-2" style="border-top:1px solid var(--cnds-border-color,#e0e0e0)">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    function openModal(roleName, isNew) {
      document.getElementById('modal-role-name').textContent = isNew ? 'New Role' : roleName;
      document.getElementById('perm-category-title').textContent = 'Identity Management Permissions';
      document.getElementById('permissions-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('permissions-modal').style.display = 'none';
    }

    function handleBackdropClick(e) {
      if (e.target === document.getElementById('permissions-modal')) closeModal();
    }

    function selectCategory(btn, title) {
      // Update active state on category buttons
      btn.closest('div').querySelectorAll('button').forEach(b => {
        b.style.background = '';
        b.style.color = '';
        b.classList.remove('fw-semibold');
        b.classList.add('text-muted');
      });
      btn.style.background = 'var(--cnds-product-expireon-blue-50,#f0f0fa)';
      btn.style.color = 'var(--cnds-product-accent,#4e45d6)';
      btn.classList.add('fw-semibold');
      btn.classList.remove('text-muted');
      document.getElementById('perm-category-title').textContent = title;
    }

    // Close modal on Escape key
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>

</body>
</html>
